name: NVIDIA-02 Task 6 Format Apply

on:
  push:
    branches:
      - tmp/nvidia-n02-task6-red

permissions:
  contents: write

jobs:
  task6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Focused CLI tests
        run: python -m pytest -q tests/nvidia/test_canary_cli.py
      - name: Apply Task 6 format
        run: python -m ruff format scripts/nvidia_lightning_canary.py tests/nvidia/test_canary_cli.py
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/nvidia_lightning_canary.py tests/nvidia/test_canary_cli.py; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nvidia_lightning_canary.py tests/nvidia/test_canary_cli.py
          git commit -m "style: format NVIDIA-02 Task 6 files"
          git push
