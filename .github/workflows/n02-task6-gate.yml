name: NVIDIA-02 Task 6 Gate

on:
  push:
    branches:
      - tmp/nvidia-n02-task6-red

permissions:
  contents: read

jobs:
  task6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Focused CLI tests
        run: python -m pytest -q tests/nvidia/test_canary_cli.py
      - name: Task 6 format check
        run: python -m ruff format --check scripts/nvidia_lightning_canary.py tests/nvidia/test_canary_cli.py
