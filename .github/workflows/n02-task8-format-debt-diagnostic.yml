name: NVIDIA-02 Task 8 Format Debt Diagnostic

on:
  push:
    branches:
      - tmp/nvidia-n02-task8-qualification

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be43e03235a171a0808e693d478eb5aebf9434af
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Confirm current debt
        shell: bash
        run: |
          set +e
          python -m ruff format --check . > "$RUNNER_TEMP/before.txt" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -E '[0-9]+ files? would be reformatted' "$RUNNER_TEMP/before.txt" | tail -1
      - name: Format only N02 implementation plan in runner
        run: |
          python -m ruff format docs/superpowers/plans/2026-09-09-nvidia-provider-n02-lightning-canary-implementation-plan.md
          git diff --check
          git diff -- docs/superpowers/plans/2026-09-09-nvidia-provider-n02-lightning-canary-implementation-plan.md
      - name: Confirm debt returns to NVIDIA-01 baseline
        shell: bash
        run: |
          set +e
          python -m ruff format --check . > "$RUNNER_TEMP/after.txt" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          cat "$RUNNER_TEMP/after.txt" | tail -5
          python - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ["RUNNER_TEMP"]) / "after.txt").read_text()
          match = re.search(r"(\d+) files? would be reformatted", text)
          if not match:
              raise SystemExit("unable to parse post-format debt")
          debt = int(match.group(1))
          print(f"POST_PLAN_FORMAT_DEBT={debt}")
          if debt != 46:
              raise SystemExit(f"expected frozen baseline 46, got {debt}")
          print("SOLE_N02_FORMAT_DEBT=CONFIRMED")
          PY
