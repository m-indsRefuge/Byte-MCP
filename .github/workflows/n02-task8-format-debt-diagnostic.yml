name: NVIDIA-02 Task 8 Format Debt Diagnostic

on:
  push:
    branches:
      - tmp/nvidia-n02-task8-qualification

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be43e03235a171a0808e693d478eb5aebf9434af
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Reproduce pre-format qualification sequence
        run: |
          python -m compileall -q src/byte_mcp scripts/nvidia_lightning_canary.py
          python -m pytest -q
          python -m ruff check .
      - name: Show working tree before format check
        run: |
          git status --short --untracked-files=all
          echo "--- untracked/modified Python files ---"
          git status --porcelain=v1 --untracked-files=all | awk '{print $2}' | grep -E '\.py$' || true
      - name: Identify current unformatted files
        shell: bash
        run: |
          set +e
          python -m ruff format --check . > "$RUNNER_TEMP/format.txt" 2>&1
          rc=$?
          set -e
          echo "RUFF_FORMAT_RC=$rc"
          cat "$RUNNER_TEMP/format.txt"
          echo "--- parsed paths ---"
          grep -E '^  --> ' "$RUNNER_TEMP/format.txt" | sed -E 's/^  --> ([^:]+):.*/\1/' | sort -u || true
