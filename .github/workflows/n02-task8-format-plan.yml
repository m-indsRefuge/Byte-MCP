name: NVIDIA-02 Task 8 Format Plan

on:
  push:
    branches:
      - tmp/nvidia-n02-task8-plan-format

permissions:
  contents: write

jobs:
  format-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/nvidia-n02-task8-plan-format
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.6
      - name: Format only N02 implementation plan
        run: |
          target=docs/superpowers/plans/2026-09-09-nvidia-provider-n02-lightning-canary-implementation-plan.md
          python -m ruff format "$target"
          git diff --check
          git status --short
          changed="$(git diff --name-only)"
          test "$changed" = "$target"
      - name: Commit exact Ruff output to temp branch
        run: |
          target=docs/superpowers/plans/2026-09-09-nvidia-provider-n02-lightning-canary-implementation-plan.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "style: format NVIDIA-02 implementation plan"
          git push origin HEAD:tmp/nvidia-n02-task8-plan-format
