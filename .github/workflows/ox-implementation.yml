name: OX Implementation Focused Gate

on:
  push:
    branches:
      - feat/ox-clean-room-rebuild

permissions:
  contents: read

jobs:
  provider-free-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Task 1 focused tests
        run: >-
          python -m pytest
          tests/ox/test_archive_absence.py
          tests/ox/test_mcp_surface.py
          -q

      - name: Neighbor regression tests
        run: python -m pytest tests/providers tests/nvidia tests/wolfram -q

      - name: Changed-scope lint
        run: >-
          python -m ruff check
          src/byte_mcp/server.py
          tests/ox/test_archive_absence.py
          tests/ox/test_mcp_surface.py
