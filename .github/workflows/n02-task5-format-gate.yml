name: NVIDIA-02 Task 5 Format Apply

on:
  push:
    branches:
      - tmp/nvidia-n02-task5-format-check

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply Task 5 format
        run: |
          python -m ruff format tests/nvidia/test_canary.py tests/nvidia/test_canary_evidence.py
          git diff -- tests/nvidia/test_canary.py tests/nvidia/test_canary_evidence.py
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/nvidia/test_canary.py tests/nvidia/test_canary_evidence.py
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: apply NVIDIA-02 Task 5 Ruff formatting"
          git push
