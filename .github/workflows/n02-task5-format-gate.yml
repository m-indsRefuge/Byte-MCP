name: NVIDIA-02 Task 5 Format Gate

on:
  push:
    branches:
      - tmp/nvidia-n02-task5-format-check

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Task 5 format check
        run: |
          python -m ruff format --check src/byte_mcp/nvidia/canary.py src/byte_mcp/nvidia/canary_evidence.py tests/nvidia/test_canary.py tests/nvidia/test_canary_evidence.py
