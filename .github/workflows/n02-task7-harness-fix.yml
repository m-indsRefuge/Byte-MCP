name: NVIDIA-02 Task 7 Harness Fix

on:
  push:
    branches:
      - tmp/nvidia-n02-task7-security

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/nvidia-n02-task7-security
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.6
      - name: Format Task 7 invariant file
        run: python -m ruff format tests/nvidia/test_n02_security_invariants.py
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- tests/nvidia/test_n02_security_invariants.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/nvidia/test_n02_security_invariants.py
          git commit -m "style: format NVIDIA-02 Task 7 invariant tests"
          git push origin HEAD:tmp/nvidia-n02-task7-security
