name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile
        run: python -m compileall -q src tests scripts/mcp_smoke_test.py scripts/wolfram_qualification.py

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

  launcher-test:
    name: Windows launcher
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Pester 5+
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester |
            Where-Object { $_.Version -ge [version]'5.0.0' } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($null -eq $pester) {
            Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Launcher tests
        shell: pwsh
        run: .\scripts\Check-Launcher.ps1

  launcher-pester6-test:
    name: Windows launcher on Pester 6
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 6.1.0
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Launcher tests
        shell: pwsh
        run: .\scripts\Check-Launcher.ps1
